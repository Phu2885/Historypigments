<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавление — Исторические пигменты</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header__label">Черновик</div>
        <h1 class="header__title">Добавление</h1>
      </header>

      <main class="page page--form">
        <form class="form" method="get" action="add.html">
          <section class="form-block">
            <div class="form-block__title">Изображение</div>
            <div class="media-box" aria-label="Добавить изображение">+ Добавить изображение</div>
          </section>

          <section class="form-block">
            <div class="form-block__title">Видео</div>
            <div class="media-box media-box--video" aria-label="Добавить видео">+ Добавить видео</div>
          </section>

          <section class="form-block">
            <div class="field">
              <label class="label" for="name">Название пигмента</label>
              <input id="name" class="input" type="text" value="Киноварь" />
            </div>

            <div class="field">
              <label class="label" for="description">Описание</label>
              <textarea id="description" class="textarea" rows="3">Исторический красный пигмент</textarea>
            </div>
          </section>

          <section class="form-block">
            <div class="field">
              <label class="label" for="color">Цвет</label>
              <input id="color" class="input" type="text" value="Красный" />
            </div>

            <div class="field">
              <label class="label" for="wavelength">Длина волны</label>
              <input id="wavelength" class="input" type="text" value="610 nm" />
            </div>

            <div class="field">
              <label class="label" for="reflection">Отражение</label>
              <input id="reflection" class="input" type="text" value="0.72" />
            </div>

            <div class="field">
              <label class="label" for="absorption">Поглощение</label>
              <input id="absorption" class="input" type="text" value="0.28" />
            </div>
          </section>
        </form>
      </main>

      <nav class="bottom-nav" aria-label="Навигация">
        <a class="bottom-nav__item" href="index.html">
          <span class="bottom-nav__icon">◧</span>
          <span>Лента</span>
        </a>
        <a class="bottom-nav__item active" href="add.html">
          <span class="bottom-nav__icon">＋</span>
          <span>Добавление</span>
        </a>
        <a class="bottom-nav__item" href="tiles.html">
          <span class="bottom-nav__icon">▦</span>
          <span>Плитка</span>
        </a>
      </nav>
    </div>
  </body>
</html>
