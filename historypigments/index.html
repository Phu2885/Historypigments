<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лента — Исторические пигменты</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header__label">Каталог пигментов</div>
        <h1 class="header__title">Лента</h1>
      </header>

      <main class="page page--feed">
        <section class="feed-hero" aria-label="Лента с историческим пигментом">
          <div class="feed-hero__overlay">
            <div class="feed-hero__eyebrow">Исторический красный пигмент</div>
            <h2 class="feed-hero__title">Киноварь</h2>

            <div class="feed-hero__more">
              <span>Больше</span>
              <span class="feed-hero__divider">/</span>
              <span>Меньше</span>
            </div>

            <div class="feed-hero__meta">
              <span>Цвет: Красный</span>
              <span>Длина волны: 610 nm</span>
              <span>Отражение: 0.72</span>
              <span>Поглощение: 0.28</span>
            </div>

            <div class="feed-hero__actions">
              <div class="like-badge">
                <span class="like-badge__icon">♡</span>
                <span>124</span>
              </div>

              <button class="btn feed-hero__button" type="button">Следующий →</button>
            </div>
          </div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Навигация">
        <a class="bottom-nav__item active" href="index.html">
          <span class="bottom-nav__icon">◧</span>
          <span>Лента</span>
        </a>
        <a class="bottom-nav__item" href="add.html">
          <span class="bottom-nav__icon">＋</span>
          <span>Добавление</span>
        </a>
        <a class="bottom-nav__item" href="tiles.html">
          <span class="bottom-nav__icon">▦</span>
          <span>Плитка</span>
        </a>
      </nav>
    </div>
  </body>
</html>
