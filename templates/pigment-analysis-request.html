{{ define "pigment-analysis-request.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление пигмента — Черновик</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="add-page">
            <h1 class="section-title">Новая запись (Черновик)</h1>

            <form action="/pigment-analysis-request" method="get">
                <div class="form-group">
                    <label>ПРЕДПРОСМОТР ИЗОБРАЖЕНИЯ</label>
                    <div class="media-preview">
                        {{ if .Pigment.ImageURL }}
                        <img src="{{ .Pigment.ImageURL }}" alt="Preview">
                        {{ else }}
                        <span>Изображение не выбрано</span>
                        {{ end }}
                    </div>
                    <input type="text" class="form-input" name="image_key" value="{{ .Pigment.ImageKey }}" placeholder="Имя файла изображения (напр. cinnabar.jpg)">
                </div>

                <div class="form-group">
                    <label>ПРЕДПРОСМОТР ВИДЕО</label>
                    <div class="media-preview">
                        {{ if .Pigment.VideoURL }}
                        <video autoplay muted loop>
                            <source src="{{ .Pigment.VideoURL }}" type="video/mp4">
                        </video>
                        {{ else }}
                        <span>Видео не выбрано</span>
                        {{ end }}
                    </div>
                    <input type="text" class="form-input" name="video_key" value="{{ .Pigment.VideoKey }}" placeholder="Имя файла видео (напр. cinnabar.mp4)">
                </div>

                <div class="form-group">
                    <label for="name">НАЗВАНИЕ ПИГМЕНТА</label>
                    <input type="text" id="name" name="name" class="form-input" value="{{ .Pigment.Name }}">
                </div>

                <div class="form-group">
                    <label for="desc">ОПИСАНИЕ</label>
                    <textarea id="desc" name="description" class="form-textarea" rows="4">{{ .Pigment.Description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="color">БАЗОВЫЙ ЦВЕТ</label>
                    <input type="text" id="color" name="color" class="form-input" value="{{ .Pigment.Color }}">
                </div>

                <div class="form-group">
                    <label for="wave">ПИКОВАЯ ДЛИНА ВОЛНЫ (НМ)</label>
                    <input type="number" id="wave" name="wavelength" class="form-input" value="{{ .Pigment.Wavelength }}">
                </div>

                <div class="form-group">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label for="refl">ОТРАЖЕНИЕ</label>
                            <input type="text" id="refl" name="reflection" class="form-input" value="{{ .Pigment.Reflection }}">
                        </div>
                        <div style="flex: 1;">
                            <label for="abs">ПОГЛОЩЕНИЕ</label>
                            <input type="text" id="abs" name="absorption" class="form-input" value="{{ .Pigment.Absorption }}">
                        </div>
                    </div>
                </div>
            </form>
        </main>

        <nav class="bottom-nav">
            <a href="/reconstruction-pigments" class="nav-item {{ if eq .Active "lenta" }}active{{ end }}">
                <span class="nav-icon">◧</span>
                <span>Лента</span>
            </a>
            <a href="/pigment-analysis-request" class="nav-item {{ if eq .Active "add" }}active{{ end }}">
                <span class="nav-icon">＋</span>
                <span>Добавить</span>
            </a>
            <a href="/pigments-database" class="nav-item {{ if eq .Active "tiles" }}active{{ end }}">
                <span class="nav-icon">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
{{ end }}
