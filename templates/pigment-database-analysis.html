{{ define "pigment-database-analysis.html" }}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ — Черновик</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="add-page">
            <h1 class="section-title">Добавление пигмента</h1>

            {{ if not .Pigment }}
            <!-- ШАГ 1: СОЗДАНИЕ ДРАФТА (Выбор локального или MinIO файла без загрузки на сервер) -->
            <form action="/create-draft" method="POST" class="analysis-form">
                <!-- МЕДИА ПРЕДПРОСМОТР (Друг под другом) -->
                <div class="media-preview-vertical">
                    <div class="media-preview-box">
                        <span class="media-preview-label">Фото (Предпросмотр)</span>
                        <img id="photoPreview" src="/assets/images/placeholder.svg" alt="Photo Preview">
                    </div>
                    <div class="media-preview-box">
                        <span class="media-preview-label">Видео (Предпросмотр)</span>
                        <video id="videoPreview" autoplay muted loop playsinline controls>
                            <source id="videoSource" src="/assets/videos/placeholder.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="form-group">
                    <label>НАЗВАНИЕ ОБРАЗЦА</label>
                    <input type="text" name="name" class="form-input" placeholder="Напр. Киноварь" required>
                </div>

                <div class="form-group">
                    <label>ВЫБОР ИЗОБРАЖЕНИЯ (Локально / MinIO)</label>
                    <select name="image_key" id="imageSelect" class="form-input" onchange="updatePhotoPreview(this.value)">
                        <option value="/assets/images/placeholder.svg" selected>Локально: По умолчанию (placeholder.svg)</option>
                        <option value="cinnabar.jpg">MinIO: cinnabar.jpg</option>
                        <option value="lapis-lazuli.jpg">MinIO: lapis-lazuli.jpg</option>
                        <option value="malachite.jpg">MinIO: malachite.jpg</option>
                        <option value="ultramarine.jpg">MinIO: ultramarine.jpg</option>
                        <option value="umber.jpg">MinIO: umber.jpg</option>
                        <option value="yellow-ochre.jpg">MinIO: yellow-ochre.jpg</option>
                        <option value="/assets/images/cinnabar.svg">Локально: Киноварь (Cinnabar)</option>
                        <option value="/assets/images/lapis.svg">Локально: Лазурит (Lapis)</option>
                        <option value="/assets/images/malachite.svg">Локально: Малахит (Malachite)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ВЫБОР ВИДЕО (Локально / MinIO)</label>
                    <select name="video_key" id="videoSelect" class="form-input" onchange="updateVideoPreview(this.value)">
                        <option value="/assets/videos/placeholder.mp4" selected>Локально: По умолчанию (placeholder.mp4)</option>
                        <option value="cinnabar.mp4">MinIO: cinnabar.mp4</option>
                        <option value="lapis-lazuli.mp4">MinIO: lapis-lazuli.mp4</option>
                        <option value="malachite.mp4">MinIO: malachite.mp4</option>
                        <option value="ultramarine.mp4">MinIO: ultramarine.mp4</option>
                        <option value="umber.mp4">MinIO: umber.mp4</option>
                        <option value="yellow-ochre.mp4">MinIO: yellow-ochre.mp4</option>
                    </select>
                </div>

                <button type="submit" class="search-btn">ДАЛЕЕ</button>
            </form>

            <script>
                function updatePhotoPreview(val) {
                    var img = document.getElementById('photoPreview');
                    if (val.startsWith('/assets/') || val.startsWith('/minio/')) {
                        img.src = val;
                    } else if (val) {
                        img.src = '/minio/historypigments/' + val;
                    } else {
                        img.src = '/assets/images/placeholder.svg';
                    }
                }

                function updateVideoPreview(val) {
                    var video = document.getElementById('videoPreview');
                    var source = document.getElementById('videoSource');
                    if (val.startsWith('/assets/') || val.startsWith('/minio/')) {
                        source.src = val;
                    } else if (val) {
                        source.src = '/minio/historypigments/' + val;
                    } else {
                        source.src = '/assets/videos/placeholder.mp4';
                    }
                    video.load();
                }
            </script>

            {{ else }}
            <!-- ШАГ 2: ПУБЛИКАЦИЯ -->
            <form action="/publish-pigment" method="POST" class="analysis-form">
                <input type="hidden" name="id" value="{{ .Pigment.ID }}">

                <!-- МЕДИА ПРЕДПРОСМОТР ВЫБРАННЫХ ФАЙЛОВ (Друг под другом) -->
                <div class="media-preview-vertical">
                    <div class="media-preview-box">
                        <span class="media-preview-label">Выбранное Фото</span>
                        <img src="{{ .Pigment.GetImage }}" alt="{{ .Pigment.Name }}" onerror="this.onerror=null; this.src='/assets/images/placeholder.svg';">
                    </div>
                    <div class="media-preview-box">
                        <span class="media-preview-label">Выбранное Видео</span>
                        <video autoplay muted loop playsinline controls>
                            <source src="{{ .Pigment.GetVideo }}" type="video/mp4">
                            <source src="/assets/videos/placeholder.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="form-group">
                    <label>ОБРАЗЕЦ: <b style="color: var(--gold); font-size: 16px;">{{ .Pigment.Name }}</b></label>
                </div>

                <div class="form-group">
                    <label>КРАТКОЕ ОПИСАНИЕ</label>
                    <textarea name="description" class="form-textarea" rows="4" placeholder="Введите экспертное описание пигмента..." required>{{ .Pigment.ShortDescription }}</textarea>
                </div>

                <div class="form-group">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>ДЛИНА ОТРАЖ. (R)</label>
                            <input type="number" name="reflection" step="0.01" class="form-input" placeholder="0.75" required>
                        </div>
                        <div style="flex: 1;">
                            <label>ДЛИНА ПОГЛ. (A)</label>
                            <input type="number" name="absorption" step="0.01" class="form-input" placeholder="0.25" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="search-btn">ОПУБЛИКОВАТЬ</button>
            </form>
            {{ end }}
        </main>

        <nav class="bottom-nav">
            <a href="/pigments-database-reconstruction" class="nav-item {{ if eq .Active "lenta" }}active{{ end }}">
                <span class="nav-icon">◧</span>
                <span>Лента</span>
            </a>
            <a href="/pigment-database-analysis" class="nav-item {{ if eq .Active "add" }}active{{ end }}">
                <span class="nav-icon">＋</span>
                <span>Добавить</span>
            </a>
            <a href="/pigments-database" class="nav-item {{ if eq .Active "tiles" }}active{{ end }}">
                <span class="nav-icon">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
{{ end }}
