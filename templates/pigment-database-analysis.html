{{ define "pigment-database-analysis.html" }}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ — Черновик</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="add-page">
            <h1 class="section-title">Добавление пигмента</h1>

            {{ if not .Pigment }}
            <!-- ШАГ 1: СОЗДАНИЕ (ввод имен файлов вручную, как в методичке) -->
            <form action="/create-draft" method="POST" class="analysis-form">
                <div class="form-group">
                    <label>Название образца</label>
                    <input type="text" name="name" class="form-input" placeholder="Напр. Киноварь" required>
                </div>

                <div class="form-group">
                    <label>ИМЯ ФАЙЛА ИЗОБРАЖЕНИЯ (в MinIO)</label>
                    <input type="text" name="image_key" class="form-input" placeholder="cinnabar.jpg">
                </div>

                <div class="form-group">
                    <label>ИМЯ ФАЙЛА ВИДЕО (в MinIO)</label>
                    <input type="text" name="video_key" class="form-input" placeholder="cinnabar.mp4">
                </div>

                <button type="submit" class="search-btn">ДАЛЕЕ</button>
            </form>
            {{ else }}
            <!-- ШАГ 2: ПУБЛИКАЦИЯ -->
            <form action="/publish-pigment" method="POST" class="analysis-form">
                <input type="hidden" name="id" value="{{ .Pigment.ID }}">

                <div class="form-group">
                    <label>Образец: <b>{{ .Pigment.Name }}</b></label>
                </div>

                <div class="form-group">
                    <label>ПРЕДПРОСМОТР</label>
                    <div class="media-preview">
                        {{ if .Pigment.GetImage }}
                        <img src="{{ .Pigment.GetImage }}" alt="Preview">
                        {{ else }}
                        <span>Файл должен быть заранее загружен в MinIO</span>
                        {{ end }}
                    </div>
                </div>

                <div class="form-group">
                    <label>КРАТКОЕ ОПИСАНИЕ</label>
                    <textarea name="description" class="form-textarea" rows="4" placeholder="Введите информацию..." required>{{ .Pigment.ShortDescription }}</textarea>
                </div>

                <div class="form-group">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>ДЛИНА ОТРАЖ. (R)</label>
                            <input type="number" name="reflection" step="0.01" class="form-input" required>
                        </div>
                        <div style="flex: 1;">
                            <label>ДЛИНА ПОГЛ. (A)</label>
                            <input type="number" name="absorption" step="0.01" class="form-input" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="search-btn">ОПУБЛИКОВАТЬ</button>
            </form>
            {{ end }}
        </main>

        <nav class="bottom-nav">
            <a href="/pigments-database-reconstruction" class="nav-item {{ if eq .Active "lenta" }}active{{ end }}">
                <span class="nav-icon">◧</span>
                <span>Лента</span>
            </a>
            <a href="/pigment-database-analysis" class="nav-item {{ if eq .Active "add" }}active{{ end }}">
                <span class="nav-icon">＋</span>
                <span>Добавить</span>
            </a>
            <a href="/pigments-database" class="nav-item {{ if eq .Active "tiles" }}active{{ end }}">
                <span class="nav-icon">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
{{ end }}
