{{ define "pigments-database.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог пигментов — Плитка</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="tiles-page">
            <h1 class="section-title">Каталог пигментов</h1>

            <div class="search-bar">
                <form action="/pigments-database" method="get" class="filter-form">
                    <div class="filter-group">
                        <label for="filter" class="filter-label">ПОГЛОЩЕНИЕ (до): <span id="rangeValue">{{ if .Filter }}{{ .Filter }}{{ else }}1.0{{ end }}</span></label>
                        <input type="range" name="filter" id="filter" min="0" max="1" step="0.01"
                               value="{{ if .Filter }}{{ .Filter }}{{ else }}1.0{{ end }}"
                               class="filter-slider" oninput="document.getElementById('rangeValue').innerText = this.value">
                    </div>
                    <button type="submit" class="search-btn">Найти</button>
                </form>
            </div>

            <section class="tiles-grid">
                {{ range .Pigments }}
                <div class="card-wrapper" style="position: relative;">
                    <a href="/pigments-database-reconstruction?id={{ .ID }}" class="card">
                        <img src="{{ .GetImage }}" alt="{{ .Name }}" class="card-img" onerror="this.onerror=null; this.src='/assets/images/placeholder.svg';">
                        <div class="card-content">
                            <h3 class="card-title">{{ .Name }}</h3>
                            <div class="card-footer">
                                <span>R: {{ .Reflection }} / A: {{ .Absorption }}</span>
                                <span>❤</span>
                            </div>
                        </div>
                    </a>
                    <!-- Кнопка удаления в едином стиле темы -->
                    <form action="/delete-pigment" method="POST" style="margin: 0; padding: 0;">
                        <input type="hidden" name="id" value="{{ .ID }}">
                        <button type="submit" class="card-delete-btn" title="Удалить пигмент">✕</button>
                    </form>
                </div>
                {{ end }}
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="/pigments-database-reconstruction" class="nav-item {{ if eq .Active "lenta" }}active{{ end }}">
                <span class="nav-icon">◧</span>
                <span>Лента</span>
            </a>
            <a href="/pigment-database-analysis" class="nav-item {{ if eq .Active "add" }}active{{ end }}">
                <span class="nav-icon">＋</span>
                <span>Добавить</span>
            </a>
            <a href="/pigments-database" class="nav-item {{ if eq .Active "tiles" }}active{{ end }}">
                <span class="nav-icon">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
{{ end }}
