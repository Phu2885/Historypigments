version: '3.8'

services:
  # Объектное хранилище (из 1-й лабы)
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: historypigments_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  # База данных PostgreSQL (для 2-й лабы)
  postgres:
    image: postgres:15-alpine
    container_name: historypigments_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: historypigments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Кэш и Blacklist токенов Redis (для 4-й лабы)
  redis:
    image: redis:6.2-alpine
    container_name: historypigments_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass rootpassword
    volumes:
      - redis-data:/data

  # Интерфейс управления БД
  adminer:
    image: adminer:latest
    container_name: historypigments_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # React SPA Фронтенд (для 5-й лабы)
  frontend:
    container_name: historypigments_frontend
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  minio-data:
  postgres_data:
  redis-data:
